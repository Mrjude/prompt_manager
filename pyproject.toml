[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-manager-client"
version = "0.3.1"
description = "提示词管理系统 - 提示词 / 知识库 / 流程树 一体化管理平台（含知识库检索器）"
requires-python = ">=3.8"
license = "MIT"
keywords = ["prompt", "prompt-manager", "llm", "retrieval", "tf-idf"]
authors = [
    {name = "prompt-manager"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "http://localhost:8900"
Source = "https://github.com/Mrjude/prompt-manager"

[project.optional-dependencies]
ws = ["websocket-client"]
semantic = ["sentence-transformers", "numpy"]
dev = ["build", "twine", "websocket-client"]

[tool.setuptools.packages.find]
include = ["client_sdk*"]
