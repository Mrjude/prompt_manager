        can_knowledge_edit: !!userSelected.value.can_knowledge_edit,
        can_knowledge_delete: !!userSelected.value.can_knowledge_delete,
        can_flow_view: !!userSelected.value.can_flow_view,
        can_flow_edit: !!userSelected.value.can_flow_edit,
        can_flow_delete: !!userSelected.value.can_flow_delete,
        is_active: !!userSelected.value.is_active,
        managed_departments: Array.isArray(userSelected.value.managed_departments) ? userSelected.value.managed_departments.slice() : []
      });
    }

    function cancelUserEdit() { userEditing.value = false; }

    async function saveUser() {
      if (userIsCreate.value && (!userForm.username || !userForm.password)) {
        showToast('用户名和密码不能为空', 'error'); return;
      }
      const pagePerms = {
        can_prompt_view: userForm.can_prompt_view,
        can_prompt_edit: userForm.can_prompt_edit,
        can_prompt_delete: userForm.can_prompt_delete,
        can_knowledge_view: userForm.can_knowledge_view,
        can_knowledge_edit: userForm.can_knowledge_edit,
        can_knowledge_delete: userForm.can_knowledge_delete,
        can_flow_view: userForm.can_flow_view,
        can_flow_edit: userForm.can_flow_edit,
        can_flow_delete: userForm.can_flow_delete
      };
      const payload = userIsCreate.value
        ? {
            username: userForm.username, password: userForm.password, role: userForm.role,
            ...pagePerms,
            managed_departments: userForm.role === 'admin' ? [] : (userForm.managed_departments || []),
          }
        : {
            role: userForm.role, is_active: userForm.is_active, ...pagePerms,
            managed_departments: userForm.role === 'admin' ? [] : (userForm.managed_departments || []),
          };
      if (!userIsCreate.value && userForm.password) payload.password = userForm.password;
      const r = await api(userIsCreate.value ? '/api/users' : `/api/users/${userSelected.value.id}`, {
        method: userIsCreate.value ? 'POST' : 'PUT',
        body: JSON.stringify(payload)
      });
      if (r) {
        showToast('账号已保存', 'success');
        userEditing.value = false;
        await loadUsers();
        selectUser(r);
      }
    }

    async function deleteSelectedUser() {
      if (!userSelected.value) return;
      if (!confirm(`确定删除账号 ${userSelected.value.username}？`)) return;
      const r = await api(`/api/users/${userSelected.value.id}`, {method: 'DELETE'});
      if (r) {
        showToast('账号已删除', 'success');
        userSelected.value = null;
        await loadUsers();
      }
    }

    // Settings
    async function loadSettings() {
      const r = await fetch(API + '/api/settings/llm/versions', {headers: authHeaders()});
      if (r.status === 401) { await logout(); return; }
      if (r.ok) {
        llmVersions.value = await r.json();
      }
    }
    async function openSettings() {
      settingsOpen.value = true;
      llmEditShow.value = false;
      await loadSettings();
    }

    function addLLMVersion() {
      llmEditIsNew.value = true;
      llmEditId.value = null;
      llmEditForm.name = '';
      llmEditForm.base_url = '';
      llmEditForm.api_key = '';
      llmEditForm.model_name = '';
      llmEditAndActivate.value = true;
      llmEditShow.value = true;
    }

    function editLLMVersion(v) {
      llmEditIsNew.value = false;
      llmEditId.value = v.id;
      llmEditForm.name = v.name || '';
      llmEditForm.base_url = v.base_url || '';
      llmEditForm.api_key = v.api_key || '';
      llmEditForm.model_name = v.model_name || '';
      llmEditAndActivate.value = false;
      llmEditShow.value = true;
    }

    async function saveLLMVersion() {
      try {
        let r;
        if (llmEditIsNew.value) {
          r = await fetch(API + '/api/settings/llm/versions', {
            method: 'POST',
            headers: authHeaders({'Content-Type': 'application/json'}),
            body: JSON.stringify(llmEditForm)
          });
        } else {
          r = await fetch(API + '/api/settings/llm/versions/' + llmEditId.value, {
            method: 'PUT',
            headers: authHeaders({'Content-Type': 'application/json'}),
            body: JSON.stringify(llmEditForm)
          });
        }
        if (r.ok) {
          const saved = await r.json();
          if (llmEditAndActivate.value) {
            await activateVersion(saved.id);
          } else {
            await loadSettings();
          }
          llmEditShow.value = false;
          showToast(llmEditIsNew.value ? '版本已创建' : '版本已更新', 'success');
        } else {
          const errText = await r.text();
          showToast('保存失败: ' + errText, 'error');
        }
      } catch(e) {
        showToast('保存失败: ' + e.message, 'error');
      }
    }

    async function activateVersion(versionId) {
      try {
        const r = await fetch(API + '/api/settings/llm/versions/' + versionId + '/activate', {method: 'POST', headers: authHeaders()});
        if (r.ok) {
          showToast('版本已激活，系统将使用此版本 API', 'success');
          await loadSettings();
        } else {
          showToast('激活失败', 'error');
        }
      } catch(e) {
        showToast('激活失败: ' + e.message, 'error');
      }
    }

    async function removeLLMVersion(versionId) {
      if (!confirm('确定删除此版本？')) return;
      try {
        const r = await fetch(API + '/api/settings/llm/versions/' + versionId, {method: 'DELETE', headers: authHeaders()});
        if (r.ok) {
          showToast('版本已删除', 'success');
          await loadSettings();
        } else {
          const data = await r.json().catch(() => ({}));
          showToast('删除失败: ' + (data.detail || ''), 'error');
        }
      } catch(e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // WebSocket
    function connectWS() {
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProto}//${location.host}/ws/updates`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        const evtMap = {updated:'更新', created:'创建', rollback:'回滚'};
        showToast(`提示词 ${msg.name} 已${evtMap[msg.event]||msg.event} (v${msg.version})`, 'info');
        loadList();
        if (selected.value && selected.value.name === msg.name) {
          api(`/api/prompts/${selected.value.id}`).then(r => { if(r) selected.value = r; });
        }
      };
      ws.onclose = () => setTimeout(connectWS, 3000);
    }

    const kbFilteredLines = Vue.computed(() => {
      let lines = kbLines.value.map((l, i) => ({...l, _idx: i}));
      if (filterKbType.value) {
        lines = lines.filter(l => (l.type || '答疑') === filterKbType.value);
      }
      if (filterKbBotId.value) {
        lines = lines.filter(l => {
          const lineBotId = l.bot_id == null ? '' : String(l.bot_id).trim();
          if (filterKbBotId.value === '__common__') return lineBotId === '';
          return lineBotId === '' || lineBotId === filterKbBotId.value;
        });
      }
      const kw = mode.value === 'knowledge' ? keyword.value.trim() : '';
      if (kw) {
        lines = lines.filter(l =>
          String(l.text || '').includes(kw)
          || String(l.type || '').includes(kw)
          || String(l.bot_id || '').includes(kw)
        );
      }
      return lines;
    });
    const kbTotalPages = Vue.computed(() => Math.ceil(kbFilteredLines.value.length / kbPageSize) || 1);
    const kbPagedLines = Vue.computed(() => {
      const start = (kbPage.value - 1) * kbPageSize;
      return kbFilteredLines.value.slice(start, start + kbPageSize);
    });

    const ftFilteredRecords = Vue.computed(() => {
      let records = ftRecords.value.slice();
      if (filterFtBotId.value) {
        records = records.filter(r => {
          const recordBotId = r.bot_id == null ? '' : String(r.bot_id).trim();
          if (filterFtBotId.value === '__common__') return recordBotId === '';
          return recordBotId === '' || recordBotId === filterFtBotId.value;
        });
      }
      const kw = mode.value === 'flow' ? keyword.value.trim() : '';
      if (kw) {
        records = records.filter(r =>
          String(r.file_name || '').includes(kw)
          || String(r.description || '').includes(kw)
          || String(r.structure || '').includes(kw)
          || String(r.bot_id || '').includes(kw)
        );
      }
      return records;
    });
    const ftTotalPages = Vue.computed(() => Math.ceil(ftFilteredRecords.value.length / ftPageSize) || 1);
    const ftPagedRecords = Vue.computed(() => {
      const start = (ftPage.value - 1) * ftPageSize;
      return ftFilteredRecords.value.slice(start, start + ftPageSize);
    });

    async function initAfterLogin() {
      await loadMeta();
      if (canPromptView.value) {
        mode.value = 'prompt';
        await loadList();
      } else if (canKnowledgeView.value) {
        mode.value = 'knowledge';
        await loadKbList();
      } else if (canFlowView.value) {
        mode.value = 'flow';
        await loadFtList();
      } else if (isAdmin.value) {
        mode.value = 'users';
      }
      connectWS();
      await loadSettings();
      if (isAdmin.value) await loadUsers();
    }

    onMounted(async () => {
      if (await checkAuth()) await initAfterLogin();
    });

    return {
      isAuthed, currentUser, isAdmin, managedDepartments, visibleDepartments,
      canPromptView, canPromptEdit, canPromptDelete,
      canKnowledgeView, canKnowledgeEdit, canKnowledgeDelete,
      canFlowView, canFlowEdit, canFlowDelete,
      loginForm, loginLoading, loginError, login, logout,
      mode, leftTitle, leftTotal,
      prompts, total, selected, versions, showVersions, viewingVersion,
      editing, isCreate, departments, platforms, scenes,
      filterDept, filterPlat, filterScene, keyword, toast, form, varBindings,
      settingsOpen, openSettings,
      llmVersions, llmEditShow, llmEditIsNew, llmEditForm, llmEditAndActivate,
      addLLMVersion, editLLMVersion, saveLLMVersion, activateVersion, removeLLMVersion,
      kbList, kbTotal, kbSelected, kbIsCreate, kbForm,
      kbLines, kbEditingIdx, kbEditingText, kbShowAddInput, kbNewLine, kbNewType, kbEditingType, kbPage, kbPageSize, kbTypes, filterKbType, kbFilteredLines, kbTotalPages, kbPagedLines,
      kbBotIds, filterKbBotId, kbNewBotId, kbEditingBotId, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom, kbNewBotIdCustom, kbEditingBotIdCustom,
      kbTypeClass,
      ftList, ftTotal, ftSelected, ftIsCreate, ftForm, ftRecords,
      ftUploadShow, ftUploadFile, ftUploadBotId, ftUploadBotIdCustom, ftEditingRecord, ftEditingRecordId, ftEditDesc,
      ftEditBotId, ftEditBotIdCustom, filterFtBotId,
      ftPage, ftPageSize, ftFilteredRecords, ftTotalPages, ftPagedRecords, ftParsingToast,
      userList, userSelected, userEditing, userIsCreate, userForm,
      deptLabel, platLabel, sceneLabel,
      selectPrompt, toggleVersions, toggleVersionContent,
      openCreate, startEdit, cancelEdit, savePrompt,
      deletePrompt, deleteVersion, rollback, loadList,
      addBinding, removeBinding, parseBindings,
      robotList, robotSelected, robotEditing, robotIsCreate, robotForm, robotMatchedList, robotPromptVersions,
      loadRobotList, selectRobot, openRobotCreate, startRobotEdit,
      startRobotEditInline, deleteRobotInline,
      cancelRobotEdit, saveRobot, deleteRobot,
      availableCompanies,
      exportKb, triggerKbImport, onKbImportFile,
      onFilterChange, switchMode,
      kbContentLines, selectKb,
      cancelKbCreate, saveKbCreate,
      startKbLineEdit, cancelKbLineEdit, saveKbLine, deleteKbLine, addKbLine,
      deleteKb,
      selectUser, openUserCreate, startUserEdit, cancelUserEdit, saveUser, deleteSelectedUser,
      selectFlowTree, ftCancelCreate, ftSaveCreate, deleteFlowTree,
      ftOnFileChange, ftCancelUpload, ftUploadFileSubmit,
      ftStartEditRecord, ftCancelEditRecord, ftSaveRecord, ftReparse, ftDeleteRecord
    };
  }
}).mount('#app');
</script>
